# Render Blueprint (TSK-0003; ARCH-STACK, INT-Render, OWN-DEC-73): one web service and one PostgreSQL 16 database.
# Names, runtime, plan and region match the existing staging service and database, which TSK-0112 points at this
# repository; nothing here has been applied to Render yet.
#
# Values: the repository holds variable names only. Non-secret settings are written below; every secret is
# `sync: false`, so Render asks the owner for it and it never appears in a file (RULE-SYNTHETIC-DATA). The full list of
# variables and what each is for is ENV_VARS in apps/server/src/config.ts; the server refuses to start when a required
# one is missing (staging: HANDYHUB_ENV, DATABASE_URL and ACCESS_GATE_USERS).
#
# Health: Render polls /healthz, the only route outside the staging access gate (no database call, no private data).
# /readyz (database and migrations) sits behind the gate.
services:
  - type: web
    name: handyhub-staging
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: HANDYHUB_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: handyhub-staging-db
          property: connectionString
      # The staging access gate's testers, "name:password" pairs; set by the owner in Render.
      - key: ACCESS_GATE_USERS
        sync: false
      # Key for one-time codes (at least 32 random characters); set by the owner in Render (TSK-0016).
      - key: CODE_HASH_KEY
        sync: false
      # Two origins (TSK-0017, OWN-DEC-133; docs/architecture.md): set both once the custom domains answer, e.g.
      # https://handyhub247.com and https://staff.handyhub247.com. Both unset: the single Render URL serves everything,
      # with the staff app under /staff.
      - key: PUBLIC_ORIGIN
        sync: false
      - key: STAFF_ORIGIN
        sync: false
      # Base URL of the staff app for invite and reset links (https). Optional once STAFF_ORIGIN is set (the default);
      # on the single Render URL: https://<service>/staff.
      - key: STAFF_APP_URL
        sync: false
      # The first Owner's email: while no Owner exists, one invite is emailed at start (TSK-0014, HH-STAFF-01).
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      # Seals optional staff authenticator secrets (at least 32 random characters); unset: MFA NOT CONFIGURED (TSK-0015).
      - key: MFA_ENCRYPTION_KEY
        sync: false
      # Seals property access codes (at least 32 random characters, not the MFA key); unset: the access-code store is
      # NOT CONFIGURED (codes cannot be entered or revealed) (TSK-0045, HH-CRM-03).
      - key: ACCESS_CODE_ENCRYPTION_KEY
        sync: false
      # Email (TSK-0112): no email provider is set up yet, so invites and resets cannot be sent. Staging only, the owner
      # may set in Render EMAIL_PROVIDER=log with TEST_EMAIL_DESTINATIONS=<the approved test addresses, comma
      # separated>: each email to one of those addresses is written to the service log as STAGING_EMAIL_LOGGED (address,
      # subject and text, so the invite or reset link can be read there); nothing is sent, every other address is
      # suppressed, and production refuses to start with it. Replace it with EMAIL_PROVIDER=resend once a domain exists.
      # Proxies that append to X-Forwarded-For in front of the service; set once measured on Render (default 0).
      - key: TRUST_PROXY_HOPS
        sync: false

databases:
  - name: handyhub-staging-db
    databaseName: handyhub_staging_db
    user: handyhub_staging_db_user
    plan: free
    region: ohio
    postgresMajorVersion: '16'
